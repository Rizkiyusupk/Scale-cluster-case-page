- name: init kubernetes
  hosts: masters
  become: yes
  tasks:
    - name: pre-pull kubernetes images
      ansible.builtin.command: kubeadm config images pull
      register: pull_output
    - name: init
      ansible.builtin.command: kubeadm init --apiserver-advertise-address=10.10.10.222 --pod-network-cidr=10.244.0.0/16 --node-name=k8s-master --apiserver-cert-extra-sans=127.0.0.1,192.168.100.36
      register: kube_output
      async: 600
      poll: 30
      ignore_errors: yes

    - name: ambil join command
      ansible.builtin.shell: kubeadm token create --print-join-command
      register: join_cmd_output

    - name: set fact join command
      set_fact:
        join_command: "{{ join_cmd_output.stdout }}"

- name: join worker ke master
  hosts: workers
  become: yes
  tasks:
    - name: join cluster
      ansible.builtin.shell: "{{ hostvars[groups['masters-cluster-2'][0]]['join_command'] }}"
